[package]
name = "rt-learn"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Zero-warning, safety-oriented Embassy firmware template for the NUCLEO-C562RE (STM32C562RE, Cortex-M33)."
authors = ["rt-learn contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noherczeg/rt-learn"
homepage = "https://github.com/noherczeg/rt-learn"
documentation = "https://github.com/noherczeg/rt-learn"
readme = "README.md"
keywords = ["embassy", "stm32c5", "embedded", "cortex-m", "no-std"]
categories = ["embedded", "no-std"]
# This is application firmware, never published to crates.io.
publish = false

[[bin]]
name = "rt-learn"
test = false
bench = false

# ---------------------------------------------------------------------------
# Dependencies
#
# NOTE ON EMBASSY VERSIONS:
# The STM32C5 series is very new; the crates.io release of `embassy-stm32`
# (0.6.0) predates it and does NOT expose the `stm32c562re` chip feature. The
# chip support lives on Embassy's `main` branch (via `stm32-data`/`stm32-metapac`).
# We therefore consume Embassy from git, pinned to an exact `rev` (below) and with
# a committed `Cargo.lock`, so every build is byte-for-byte reproducible. Bump this
# SHA deliberately (never a moving `branch`) after re-validating the whole gate.
# ---------------------------------------------------------------------------
[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "0.3.8"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

embassy-executor = { version = "0.10", git = "https://github.com/embassy-rs/embassy", rev = "5b878d927dbfc0422f1294dc02ed47221f13ac1f", features = [
    "platform-cortex-m", # renamed from `arch-cortex-m` in embassy-executor 0.10
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5", git = "https://github.com/embassy-rs/embassy", rev = "5b878d927dbfc0422f1294dc02ed47221f13ac1f", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-stm32 = { version = "0.6", git = "https://github.com/embassy-rs/embassy", rev = "5b878d927dbfc0422f1294dc02ed47221f13ac1f", features = [
    "defmt",
    "stm32c562re",     # <- STM32C562RE chip selection (must match the target above)
    "time-driver-any", # let the HAL pick a hardware timer for embassy-time
] }

# ---------------------------------------------------------------------------
# Compiler profiles
#
# Both profiles use a single codegen unit + LTO for the smallest, most optimized
# image, and `panic = "abort"` because unwinding has no place on bare metal.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1          # even debug builds need some optimization to fit/behave sanely
debug = 2              # full debuginfo for on-target debugging
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release]
opt-level = "s"        # optimize for size on a flash-constrained MCU
debug = 2              # keep debuginfo; it is stripped from the flashed image anyway
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true # keep arithmetic checks on: safety over raw speed
